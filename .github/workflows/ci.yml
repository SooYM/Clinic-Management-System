name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password-only
          MYSQL_DATABASE: clinic_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: mysql://root:ci-root-password-only@127.0.0.1:3306/clinic_test
      APP_ORIGIN: http://127.0.0.1:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm run build:demo
      - name: Verify demo isolation in build artifacts
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync } from 'node:fs';
          const bundle = directory => readdirSync(directory).filter(name => name.endsWith('.js')).map(name => readFileSync(directory + '/' + name, 'utf8')).join('\n');
          const marker = 'clinic-session-demo-v1';
          if (bundle('dist/assets').includes(marker)) throw new Error('Normal build includes browser demo fixtures.');
          if (!bundle('dist-demo/assets').includes(marker)) throw new Error('Demo build is missing its session fixture store.');
          JS
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
